packages:
  - packages/*
  - tests/*
  - tests/standard/*
  - examples/*
  - examples/providers/*
  - examples/playgrounds/*
  - examples/standard/*
  - apps/*

catalog:
  '@types/react': ^19
  '@types/react-dom': ^19

# apps/docs is a Next.js app that never loads Vite or Svelte, but its optional
# peer chain (@vercel/analytics -> @sveltejs/kit -> @sveltejs/vite-plugin-svelte)
# is resolved against the Vite 6 that fumadocs-mdx@14 pins there. Harmless.
peerDependencyRules:
  allowedVersions:
    '@sveltejs/vite-plugin-svelte>vite': '6'

minimumReleaseAge: 2880

# tree-sitter-cli downloads its binary in its install script, for
# packages/tree-sitter-flags. No other dependency runs install scripts.
onlyBuiltDependencies:
  - tree-sitter-cli

minimumReleaseAgeExclude:
  - 'flags'
  - 'next'
  - '@next/*'
  - '@flags-sdk/*'
  - '@vercel/*'

overrides:
  "postcss": "^8.5.23"
  "esbuild": "^0.28.1"
  "uuid": "^11.1.1"
  "brace-expansion@>=4": "^5.0.12"
  "dompurify": "^3.4.17"
  "fast-uri": "^3.1.9"
  "js-yaml@3": "3.15.2"
  "js-yaml@4": "^4.3.2"
  "mermaid": "^11.16.1"
  "nanoid@3": "^3.3.18"
  "nanoid@>=4": "^5.1.16"
  "@sveltejs/kit": "^2.70.2"
  "@modelcontextprotocol/server@2": "^2.3.0"
  "undici@6": "^6.29.1"
  "zod@4": "^4.6.6"

  "@ai-sdk/provider-utils@4": "^4.0.33"
  "@humanfs/node": "^0.16.8"
  "baseline-browser-mapping": "^2.11.0"
  "brace-expansion@1": "^1.1.21"
  "brace-expansion@2": "^2.1.7"
  "browserslist": "^4.28.7"
  "cookie@<0.7": "^0.7.2"
  "devalue": "^5.9.3"
  "fflate@0.8": "^0.8.3"
  "follow-redirects": "^1.16.1"
  "image-size": "^2.0.3"
  "katex": "^0.18.2"
  "launch-editor": "^2.14.2"
  "postcss-selector-parser": "^7.1.6"
  "sharp": "^0.35.5"
  "shell-quote": "^1.11.0"
  "source-map-js": "^1.2.2"

  # Remove unpatched sprintf-js; the js-yaml CLI patch supports argparse 2.
  "js-yaml@3>argparse": "^2.0.1"

  # The provider examples of v5 use the workspace packages directly. The
  # examples of providers without an OpenFeature server provider (Statsig,
  # PostHog) stay on the released v4 of the Flags SDK, from npm.

patchedDependencies:
  js-yaml@3.15.2: patches/js-yaml@3.15.2.patch
